<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Select por Prioridad</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f8f9fa;
        padding: 40px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #333;
    }

    select {
        width: 80px;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 20px;
        background: white;
        text-align: center;
    }

    option {
        font-weight: bold;
    }
</style>
</head>
<body>

<label for="prioridad">Nivel de Prioridad</label>
<label class="form-label">Nivel de Prioridad</label>
<select class="form-select" name="prioridad">
    <option value="0">Seleccionar prioridad</option>
    <option value="1">
        <span style="color:#28a745">●</span> 1°
    </option>
    <option value="2">
        <span style="color:#ffc107">●</span> 2°
    </option>
    <option value="3">
        <span style="color:#fd7e14">●</span> 3°
    </option>
    <option value="4">
        <span style="color:#dc3545">●</span> 4°
    </option>
    <option value="5">
        <span style="color:#007bff">●</span> 5°
    </option>
    <option value="6">
        <span style="color:#6f42c1">●</span> 6°
    </option>
</select>

</body>
</html>
